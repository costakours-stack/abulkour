# Wakes the Abulkour server (Render free plan sleeps when idle) shortly before the
# US market opens on weekdays, so the AI paper trader can run from open to close.
# The server then keeps itself awake until the close. Two times cover summer/winter time.
name: Wake server before market open
on:
  schedule:
    - cron: "20 13 * * 1-5" # 09:20 New York in summer (EDT)
    - cron: "20 14 * * 1-5" # 09:20 New York in winter (EST)
  workflow_dispatch: {}
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 https://abulkour-api.onrender.com/api/health
